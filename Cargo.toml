[package]
name = "kalimba"
version = "0.1.0"
edition = "2021"
authors = ["Michael Gernreich", "Claude (Anthropic) <noreply@anthropic.com>"]
description = "The kalimba body: its cut file and SolidCraft design from a few numbers, and its 3D view"
license-file = "LICENSE"
publish = false
autobins = false

# The generator: the cut file and the SolidCraft design. It reads the
# rosette from the knotwork-soundholes checkout beside this one.
[[bin]]
name = "kalimba"
path = "kalimba.rs"

# The 3D page's builder. It reads the cut files with lasermade-tools' turn3d
# module, so it expects that checkout beside this one.
[[bin]]
name = "viewer"
path = "viewer.rs"

[dependencies]
lasermade-tools = { path = "../lasermade-tools" }
